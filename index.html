<style>
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#FAF8F4;
  --ink:#1C1B1A; --ink-2:#5E5A55; --ink-3:#8F8A84;
  --line:rgba(28,27,26,.09); --line-2:rgba(28,27,26,.14);
  --accent:#B4501A; --accent-hover:#A04614; --accent-soft:#FBEDE3; --accent-ink:#8A3A0E;
  --danger:#B42318; --danger-soft:#FDECEA; --ok:#1E7046; --ok-soft:#E5F3EA;
  --s-cash:#C8682A; --s-qr:#1C74A8;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --r:14px; --r-sm:10px;
  --shadow-1:0 1px 2px rgba(28,27,26,.05),0 1px 1px rgba(28,27,26,.03);
  --shadow-2:0 10px 30px -10px rgba(28,27,26,.25),0 2px 6px rgba(28,27,26,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
.num,.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:650}
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:15px;letter-spacing:-.005em}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2);margin:4px 0 0;font-size:14px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:0;height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 12px 18px calc(12px + env(safe-area-inset-left));border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:2px}

.brand{display:block;padding:2px 10px 22px;border-radius:12px;transition:transform 160ms var(--ease-out)}
.brand .brand-logo{width:100%;max-width:184px}
.brand:active{transform:scale(.98)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--ink-3)}
.nav-item,.tab{text-decoration:none}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-weight:520;font-size:14.5px;transition:background-color 150ms ease,color 150ms ease}
.nav-item.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.nav-item.on svg{color:var(--accent)}
.nav-item .badge{margin-left:auto}
.side-foot:has(.install-btn[hidden]){display:none}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.link{color:var(--ink-2);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);width:max-content}
main{min-width:0;padding:calc(28px + env(safe-area-inset-top)) calc(32px + env(safe-area-inset-right)) 48px 32px}
.view{max-width:1240px;margin:0 auto}
.view.enter{animation:viewIn 140ms ease-out both}
@keyframes viewIn{from{opacity:.0}to{opacity:1}}
.m-top{display:none}
.tabbar{display:none}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;font-weight:600;font-size:14.5px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);transition:transform 140ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,opacity 150ms ease;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.xl{height:52px;font-size:16px;border-radius:14px;width:100%;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.42;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:rgba(118,118,128,.1);transition:transform 140ms var(--ease-out),background-color 150ms ease}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:#F7F5F1}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.ghost:hover{background:rgba(118,118,128,.1)}
  .nav-item:not(.on):hover{background:rgba(118,118,128,.08);color:var(--ink)}
  .icon-btn:hover{background:rgba(118,118,128,.18)}
  .card.prod:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
  .row-item:hover{background:#FBFAF8}
  .chip:not(.on):hover{background:rgba(118,118,128,.14)}
  .link:hover{color:var(--ink)}
}
:focus-visible{outline:2.5px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}

.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;min-width:260px;color:var(--ink-3)}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);font-size:15px}
.search:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.search.big{height:52px;border-radius:14px;font-size:16px}
.search.big input{font-size:16px}
.kbd{font-size:11.5px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-3);white-space:nowrap}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;background:rgba(118,118,128,.09);font-size:14px;font-weight:540;color:var(--ink-2);white-space:nowrap;transition:background-color 150ms ease,color 150ms ease,transform 140ms var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip svg.i{width:17px;height:17px}
.chip .n{font-size:12px;color:var(--ink-3)}
.chip.on{background:var(--ink);color:#fff}
.chip.on .n{color:rgba(255,255,255,.65)}
.chip.warn{background:var(--danger-soft);color:var(--danger)}
.chip.warn.on{background:var(--danger);color:#fff}

.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:rgba(118,118,128,.12);border-radius:10px;padding:2px;min-width:240px}
.seg-ind{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 1px rgba(0,0,0,.04);transform:translateX(calc(var(--i) * 100%));transition:transform 240ms var(--ease-in-out)}
.seg button{position:relative;z-index:1;height:34px;font-size:14px;font-weight:560;color:var(--ink-2);transition:color 150ms ease;padding:0 12px}
.seg button.on{color:var(--ink)}
.seg.lg button{height:44px;font-size:15px}
.seg.lg{border-radius:12px} .seg.lg .seg-ind{border-radius:10px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill svg.i{width:14px;height:14px;stroke-width:2}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.neutral{background:rgba(118,118,128,.12);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:11px;height:40px;background:var(--surface)}
.stepper button{width:40px;height:100%;display:grid;place-items:center;font-size:20px;color:var(--ink-2);border-radius:10px;transition:transform 120ms var(--ease-out),background-color 120ms ease}
.stepper button:active{transform:scale(.92);background:rgba(118,118,128,.12)}
.stepper .v{min-width:56px;text-align:center;font-weight:620;font-variant-numeric:tabular-nums}
.stepper input{width:64px;text-align:center;border:0;outline:0;background:transparent;font-weight:620;font-size:16px;font-variant-numeric:tabular-nums}
.stepper.sm{height:30px;border-radius:9px}
.stepper.sm button{width:30px;font-size:16px}
.stepper.sm .v{min-width:48px;font-size:13px}

.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--ink-2);font-weight:550}
.field input,.field select{height:42px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--surface);outline:0;font-size:15px;width:100%}
.field input:focus,.field select:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.switch{position:relative;width:48px;height:28px;border-radius:14px;background:#D6D3CE;flex:none;transition:background-color 200ms ease}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform 220ms var(--ease-out)}
.switch.on{background:#34A853}
.switch.on::after{transform:translateX(20px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);width:100%;text-align:left}

/* ---------- Cards / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-1);min-width:0}
.panel h3{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3 small{font-weight:500;color:var(--ink-3);font-size:12.5px}

.alert{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-weight:560;font-size:14px;margin-bottom:16px;text-align:left;transition:transform 140ms var(--ease-out)}
.alert:active{transform:scale(.99)}
.alert .go{margin-left:auto;text-decoration:underline;text-underline-offset:3px}

/* Product tile (stands in for a photo) */
.ph{position:relative;display:grid;place-items:center;background:var(--tile);color:var(--ink-c);border-radius:12px;aspect-ratio:4/3;overflow:hidden}
.ph svg.pi{width:42%;height:auto;max-width:96px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ph::before{content:"";position:absolute;inset:auto -20% -55% -20%;height:80%;border-radius:50%;background:rgba(255,255,255,.35)}
.ph svg{position:relative}
.ph-code{position:absolute;top:8px;left:9px;font-size:11px;font-weight:650;letter-spacing:.02em;color:var(--ink-c);opacity:.75}
.ph-tag{position:absolute;top:7px;right:8px;font-size:11px;font-weight:650;background:rgba(255,255,255,.75);color:var(--ink-c);padding:2px 7px;border-radius:999px}
.ph.sm{width:48px;height:48px;aspect-ratio:auto;border-radius:11px;flex:none}
.ph.sm::before{display:none}
.ph.sm svg.pi{width:30px}
.ph.lg{width:96px;height:96px;aspect-ratio:auto;border-radius:20px;flex:none}
.ph.lg svg.pi{width:58px}
/* Fotos de producto */
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit}
.ph.photo{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.ph.photo::before{display:none}
.ph.photo .ph-code{background:rgba(255,255,255,.85);color:var(--ink);opacity:1;padding:2px 7px;border-radius:999px;top:7px;left:8px;z-index:1}
.ph.photo .ph-tag{background:rgba(255,255,255,.85);color:var(--ink);z-index:1}
.ph img.in{animation:photoIn 280ms var(--ease-out) both}
@keyframes photoIn{from{opacity:0;filter:blur(6px);transform:scale(1.03)}to{opacity:1;filter:none;transform:none}}
.ph-wrap{position:relative;flex:none}
.ph-edit{position:absolute;right:-6px;bottom:-6px;width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.16),0 0 0 1px var(--line);cursor:pointer;transition:transform 140ms var(--ease-out)}
.ph-edit:active{transform:scale(.92)}
.ph-edit svg.i{width:17px;height:17px}
.photo-pick{display:flex;align-items:center;gap:16px;padding:12px;border:1.5px dashed var(--line-2);border-radius:16px;background:var(--surface-2);transition:border-color 150ms ease,background-color 150ms ease}
.photo-pick.drop{border-color:var(--accent);background:var(--accent-soft)}
.photo-pick .pp-actions{display:grid;gap:6px;justify-items:start}
.photo-pick .hint{font-size:12.5px;color:var(--ink-3)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card.prod{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow-1);transition:transform 160ms var(--ease-out),box-shadow 200ms ease,border-color 200ms ease}
.card.prod:active{transform:scale(.98)}
.card.prod.low{border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.pc-body{padding:10px 6px 6px;display:grid;gap:3px}
.pc-cat{font-size:12px;color:var(--ink-3);font-weight:550}
.pc-name{font-weight:640;font-size:15px;letter-spacing:-.005em;line-height:1.25}
.pc-price{font-size:13.5px;color:var(--ink-2)}
.pc-stock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13.5px}
.pc-stock b{font-weight:640;font-variant-numeric:tabular-nums}
.low .pc-stock b{color:var(--danger)}
.meter{position:relative;height:4px;border-radius:2px;background:rgba(118,118,128,.14);margin-top:6px;overflow:hidden}
.meter i{position:absolute;inset:0;transform-origin:left;background:#8BB89C;border-radius:2px}
.low .meter i{background:var(--danger)}
.meter s{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.grid.stagger .card{animation:rise 300ms var(--ease-out) both;animation-delay:calc(var(--k) * 32ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:48px 16px;text-align:center;color:var(--ink-3)}
.empty svg.i{width:36px;height:36px;margin:0 auto 10px;display:block;stroke-width:1.4}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.pos-list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;transition:transform 140ms var(--ease-out),background-color 150ms ease}
.row-item:active{transform:scale(.985)}
.row-item .ri-main{flex:1;min-width:0}
.ri-name{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-meta{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ri-add{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-weight:620;font-size:13.5px;flex:none}
.low-txt{color:var(--danger);font-weight:600}
.pos-cart{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.cart-lines{overflow:auto;padding:0 10px;flex:1;min-height:120px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 8px;border-top:1px solid var(--line);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.cl:first-child{border-top:0}
@starting-style{.cl.new{opacity:0;transform:translateY(6px)}}
.cl-name{font-weight:620;font-size:14.5px;line-height:1.3}
.cl-meta{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.mode-tag{font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:6px;background:rgba(118,118,128,.12);color:var(--ink-2)}
.mode-tag.saco{background:#F5E6D6;color:#8A3A0E}
.mode-tag.medio{background:#F6ECCB;color:#6E4F08}
.mode-tag.kilo{background:#E2F0E3;color:#25592F}
.cl-total{font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.cl-ctrl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.cart-foot{padding:14px 18px 18px;border-top:1px solid var(--line);display:grid;gap:12px}
.tot{display:flex;align-items:baseline;justify-content:space-between}
.tot span{color:var(--ink-2);font-weight:550}
.tot b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.closed-note{font-size:13px;color:var(--danger);text-align:center}
.cartbar{display:none}

/* ---------- Sheet ---------- */
.sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(24,20,16,.34);opacity:0;transition:opacity 320ms ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform 440ms var(--ease-drawer);box-shadow:0 -10px 40px rgba(0,0,0,.12);will-change:transform}
.sheet-root.open{pointer-events:auto}
.sheet-root.open .scrim{opacity:1}
.sheet-root.open .sheet{transform:translateY(0)}
.sheet-root.closing .sheet{transition-duration:300ms}
.sheet-root.closing .scrim{transition-duration:240ms}
.sheet-root.instant .sheet,.sheet-root.instant .scrim{transition:none!important}
.sh-head{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;touch-action:none;position:relative}
.grabber{position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(118,118,128,.3)}
.sh-head h2{flex:1;padding-top:12px}
.sh-head .icon-btn{margin-top:12px}
.sh-body{overflow:auto;padding:6px 20px calc(20px + env(safe-area-inset-bottom));display:grid;gap:16px;overscroll-behavior:contain}
.sh-swap{animation:swap 200ms var(--ease-out)}
@keyframes swap{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
@media (min-width:820px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;width:min(520px,92vw);max-height:88dvh;border-radius:20px;opacity:0;transform:translate(-50%,-48%) scale(.96);transition:transform 240ms var(--ease-out),opacity 200ms var(--ease-out);box-shadow:var(--shadow-2),0 30px 80px -20px rgba(0,0,0,.3)}
  .sheet.wide{width:min(720px,94vw)}
  .sheet-root.open .sheet{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .sheet-root.closing .sheet{transition-duration:160ms}
  .grabber{display:none}
  .sh-head{padding:16px 20px 6px}
  .sh-head h2,.sh-head .icon-btn{padding-top:0;margin-top:0}
}

/* Product detail */
.pd-top{display:flex;gap:16px;align-items:center}
.pd-top h2{font-size:22px;letter-spacing:-.015em;line-height:1.15}
.pd-top .muted{font-size:13.5px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:1px;min-width:0}
.stat span{font-size:12px;color:var(--ink-3);font-weight:550}
.stat b{font-size:19px;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.stat small{font-size:12.5px;color:var(--ink-2)}
.stat.low b{color:var(--danger)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.price{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.price span{font-size:12.5px;color:var(--ink-2);font-weight:560}
.price b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.price small{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0;display:flex;gap:8px;align-items:flex-start}
.note svg.i{width:17px;height:17px;color:var(--ink-3);margin-top:1px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Chooser */
.opt-panel{display:grid;gap:12px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{height:40px;min-width:62px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);font-weight:600;font-variant-numeric:tabular-nums;transition:transform 120ms var(--ease-out),background-color 150ms ease,color 150ms ease,border-color 150ms ease}
.quick button:active{transform:scale(.96)}
.quick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.summary{border-radius:14px;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;display:grid;gap:4px}
.summary .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.summary .l1 b{font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.summary .l2{font-size:13px;color:var(--ink-2)}
.summary.bad .l2{color:var(--danger);font-weight:560}

/* Pay */
.pay-total{text-align:center;padding:4px 0}
.pay-total span{font-size:13px;color:var(--ink-2);font-weight:550}
.pay-total b{display:block;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.money-in{display:flex;align-items:center;gap:8px;height:56px;border:1px solid var(--line-2);border-radius:14px;padding:0 16px;font-size:24px;font-weight:650}
.money-in span{color:var(--ink-3);font-size:18px}
.money-in input{border:0;outline:0;width:100%;font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;background:transparent}
.money-in:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.change{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:14px 16px;background:var(--ok-soft);color:var(--ok);transition:background-color 200ms ease,color 200ms ease}
.change span{font-weight:600}
.change b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.change.short{background:var(--danger-soft);color:var(--danger)}
.change.wait{background:var(--surface-2);color:var(--ink-3)}
.qr-box{display:grid;justify-items:center;gap:10px;padding:8px 0}
.qr-box svg{width:200px;height:200px;border-radius:12px;background:#fff;padding:10px;border:1px solid var(--line-2)}

.success{display:grid;justify-items:center;text-align:center;gap:6px;padding:8px 0 4px}
.check{width:64px;height:64px}
.check circle{fill:var(--ok-soft);transform-origin:center;animation:pop 360ms var(--ease-out) both}
.check path{fill:none;stroke:var(--ok);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw 320ms var(--ease-out) 120ms forwards}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.success .big{font-size:15px;color:var(--ink-2)}
.success .big b{display:block;font-size:34px;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.changes{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.changes .ch{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.changes .ch:first-child{border-top:0}
.changes .ch b{font-variant-numeric:tabular-nums;font-weight:620;text-align:right}
.changes h4{font-size:12px;color:var(--ink-3);padding:10px 12px 0;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* ---------- Reports ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-1)}
.kpi span{font-size:13px;color:var(--ink-2);font-weight:550}
.kpi b{display:block;font-size:28px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.15}
.kpi small{font-size:12.5px;color:var(--ink-3)}
.r-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.chart{position:relative}
.chart-plot{position:relative;height:200px;margin-left:44px}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.gl span{position:absolute;right:calc(100% + 8px);top:-8px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;height:100%;position:relative;cursor:default}
.bar i{position:absolute;left:0;right:0;bottom:0;background:var(--s-cash);border-radius:4px 4px 0 0;min-height:2px;transition:opacity 120ms ease}
.bars:hover .bar i{opacity:.55}
.bars .bar:hover i{opacity:1}
.xlabels{display:flex;gap:3px;margin-left:44px;margin-top:6px}
.xlabels span{flex:1;font-size:11px;color:var(--ink-3);text-align:center;white-space:nowrap;overflow:visible}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;border-radius:9px;padding:7px 10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));opacity:0;transition:opacity 120ms ease;box-shadow:var(--shadow-2)}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line)}
.hbar:first-child{border-top:0;padding-top:0}
.hbar .nm{font-size:14px;font-weight:580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .nm small{color:var(--ink-3);font-weight:500}
.hbar .vl{font-size:14px;font-weight:620;font-variant-numeric:tabular-nums;text-align:right}
.hbar .tr{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(118,118,128,.1);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--s-cash);border-radius:3px}
.split{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:6px 0 14px}
.split i{display:block;height:100%}
.legend{display:grid;gap:10px}
.lg-row{display:flex;align-items:center;gap:10px;font-size:14px}
.lg-row .sw{width:12px;height:12px;border-radius:3px;flex:none}
.lg-row b{margin-left:auto;font-variant-numeric:tabular-nums}
.lg-row small{color:var(--ink-3);font-variant-numeric:tabular-nums;width:44px;text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:left;padding:0 6px 8px}
table.t td{padding:9px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t .r{text-align:right}
.low-list .row-item{border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 2px;background:transparent}
.low-list .row-item:first-child{border-top:0}
.sale{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.sale:first-child{border-top:0}
.sale .tm{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sale .it{font-size:14px;min-width:0}
.sale .it div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sale .it small{color:var(--ink-3)}
.sale .am{font-weight:640;font-variant-numeric:tabular-nums;text-align:right}
.sale.void .it,.sale.void .am{text-decoration:line-through;color:var(--ink-3)}
.hold{position:relative;height:32px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:620;color:var(--danger);background:var(--danger-soft);overflow:hidden;transition:transform 140ms var(--ease-out);user-select:none;-webkit-user-select:none;touch-action:none}

  cost = p.granel ? kgs * p.costKg : qty * p.cost;
  return {pid:p.code, name:p.name, mode, qty, kg:r2(kgs), unit, total:r2(total), cost:r2(cost)};
}

const MENU = [
  ['P-001','kilo',34], ['P-002','saco',3.4], ['F-001','unidad',10], ['S-001','unidad',8], ['S-002','unidad',9],
  ['G-001','kilo',6], ['G-002','kilo',5], ['P-002','kilo',6], ['O-001','kilo',4], ['O-002','kilo',3],
  ['A-003','unidad',6], ['A-001','unidad',1.5], ['A-002','unidad',1.5], ['F-002','unidad',2.5], ['P-001','medio',1.6],
  ['G-001','medio',0.8], ['P-004','kilo',3], ['P-003','kilo',4], ['P-001','saco',0.7], ['P-002','medio',1.2], ['P-004','saco',0.25],
];
const KILO_Q = [0.5,1,1,1.5,2,2,2,2.5,3,3,4,5];

function generate(){
  const rand = rng(20261119);
  const prods = SEED_PRODUCTS.map(p => ({...p}));
  const byId = Object.fromEntries(prods.map(p => [p.code, p]));
  const wsum = MENU.reduce((a, m) => a + m[2], 0);
  const pick = () => { let r = rand() * wsum; for (const m of MENU){ r -= m[2]; if (r <= 0) return m; } return MENU[0]; };
  const mkSale = ts => {
    const nl = rand() < .56 ? 1 : rand() < .82 ? 2 : 3;
    const lines = [], used = new Set();
    for (let k = 0; k < nl; k++){
      let m, guard = 0; do { m = pick(); guard++; } while (used.has(m[0]+m[1]) && guard < 10);
      used.add(m[0]+m[1]);
      const p = byId[m[0]];
      let q = 1;
      if (m[1] === 'kilo') q = KILO_Q[Math.floor(rand() * KILO_Q.length)];
      else if (m[1] === 'unidad' && p.cat === 'snacks') q = rand() < .3 ? 2 : 1;
      lines.push(makeLine(p, m[1], q));
    }
    const total = r2(lines.reduce((a, l) => a + l.total, 0));
    const method = rand() < .6 ? 'efectivo' : 'qr';
    let received = total;
    if (method === 'efectivo'){
      const opts = [10,20,50,100,200].filter(b => b >= total);
      if (!opts.length) received = Math.ceil(total / 100) * 100;
      else if (rand() < .2 && Number.isInteger(total)) received = total;
      else received = opts[Math.min(opts.length - 1, Math.floor(rand() * 2))];
    }
    return {ts, lines, total, method, received, change:r2(received - total), void:false};
  };
  const now = Date.now(), today = startOfDay(now);
  const sales = [];
  // 30 días anteriores
  for (let d = 30; d >= 1; d--){
    const day = today - d * DAY;
    let daySales;
    for (let tries = 0; tries < 40; tries++){
      const n = 12 + Math.floor(rand() * 9);
      const times = Array.from({length:n}, () => day + (8.5 + rand() * 11.5) * 36e5).sort((a, b) => a - b);
      daySales = times.map(mkSale);
      const avg = daySales.reduce((a, s) => a + s.total, 0) / n;
      if (avg >= 90 && avg <= 140) break;
    }
    sales.push(...daySales);
  }
  // Hoy: caja abierta 08:30 con Bs 200 y unas 8 ventas
  let open = today + 8.5 * 36e5;
  if (open > now - 36e5) open = now - 36e5;
  let end = now - 6 * 6e4, start = open + 10 * 6e4;
  if (end - start < 30 * 6e4) start = end - 60 * 6e4;
  for (let tries = 0; tries < 40; tries++){
    const times = Array.from({length:8}, () => start + rand() * (end - start)).sort((a, b) => a - b);
    const ts = times.map(mkSale);
    const avg = ts.reduce((a, s) => a + s.total, 0) / 8;
    if (avg >= 90 && avg <= 140 || tries === 39){ sales.push(...ts); break; }
  }
  sales.forEach((s, i) => s.id = 1001 + i);
  return {
    v: 3, genDay: dayKey(now), products: prods, sales, seq: 1001 + sales.length,
    caja: {open:true, openedAt:open, inicial:200}, cierres: [], conteo: {},
  };
}

/* Ajusta la foto: máx. 720 px, JPEG — liviana y nítida en pantallas retina */
function readPhoto(file){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('tipo'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 720 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* Arrastrar para cerrar (móvil): 1:1, rubber-band hacia arriba, velocidad al soltar */
(function drag(){
  let st = null;
  sheet.addEventListener('pointerdown', e => {
    if (!mobile() || st) return;
    const h = e.target.closest('[data-drag]');
    if (!h || e.target.closest('button')) return;
    sheet.setPointerCapture(e.pointerId);
    st = {id:e.pointerId, y0:e.clientY, t0:performance.now(), hist:[{y:e.clientY, t:performance.now()}], dy:0, h:sheet.offsetHeight};
    sheet.style.transition = 'none';
  });
  sheet.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    let dy = e.clientY - st.y0;
    if (dy < 0){ const d = st.h, c = .55; dy = -(Math.abs(dy) * d * c) / (d + c * Math.abs(dy)) * .35; }
    st.dy = dy;
    st.hist.push({y:e.clientY, t:performance.now()}); if (st.hist.length > 6) st.hist.shift();
    sheet.style.transform = `translateY(${dy}px)`;
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return;
    const h = st.hist, a = h[0], b = h[h.length - 1];
    const v = (b.y - a.y) / Math.max(1, b.t - a.t); // px/ms
    const dy = st.dy; st = null;
    sheet.style.transition = '';
    if (dy > 0 && (dy > sheet.offsetHeight * .28 || v > .45)) closeSheet();
    else sheet.style.transform = '';
  };
  sheet.addEventListener('pointerup', end);
  sheet.addEventListener('pointercancel', end);
})();

function submitForm(form){
  const ctx = sheetCtx; const fd = new FormData(form); const g = ctx.granel;
  const v = k => parseNum(fd.get(k));
  const err = m => { const e = form.querySelector('#f-err'); e.textContent = m; e.hidden = false; };
  const name = String(fd.get('name') || '').trim(); if (!name) return err('Escriba el nombre del producto.');
  const cat = fd.get('cat');
  let p = ctx.id ? P(ctx.id) : null;
  const data = {name, cat, granel:g};
  if (g){
    const saco = v('sacoKg');
    Object.assign(data, {sacoKg: saco > 0 ? saco : null, pSaco:v('pSaco'), pMedio:v('pMedio'), pKilo:v('pKilo'), costKg:v('costKg'), stock:r2(v('stockKg')), min:v('minKg')});
    if (!(data.pKilo > 0)) return err('Falta el precio por kilo.');
    if (data.sacoKg && !(data.pSaco > 0 && data.pMedio > 0)) return err('Faltan los precios de saco y medio saco.');
    if (!(data.costKg >= 0)) return err('Falta el costo por kilo.');
    if (isNaN(data.stock)) data.stock = 0; if (isNaN(data.min)) data.min = 0;
    data.stock = Math.round(data.stock * 2) / 2;
  } else {
    Object.assign(data, {price:v('price'), cost:v('cost'), stock:Math.round(v('stockU')) || 0, min:Math.round(v('minU')) || 0});
    if (!(data.price > 0)) return err('Falta el precio.');
    if (!(data.cost >= 0)) data.cost = 0;
  }
  if (p){
    ['sacoKg','pSaco','pMedio','pKilo','costKg','price','cost'].forEach(k => delete p[k]);
    Object.assign(p, data);
  } else {
    const pre = {perros:'P', gatos:'G', otras:'O', snacks:'S', accesorios:'A', antipulgas:'F'}[cat];
    const n = S.products.filter(x => x.code.startsWith(pre + '-')).length + 1;
    p = {code: pre + '-' + String(n).padStart(3, '0'), ...data};
    S.products.push(p);
  }
  if (ctx.photo !== undefined) setPhoto(p.code, ctx.photo);
  save(); closeSheet(); toast(ctx.id ? 'Cambios guardados' : 'Producto agregado: ' + p.name);
  if (UI.view === 'inventario'){ renderInvChips(); renderInvGrid(); renderNav(); } else render();
}

    else { box.className = 'change'; box.innerHTML = `<span>Cambio</span><b>${bs(r - t)}</b>`; ok.disabled = false; }
  }

function qrSVG(seed){
  const n = 25, rnd = rng(Math.round(seed * 100) + 7), cells = [];
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#1C1B1A"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#1C1B1A"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!inF(x, y) && rnd() < .5) cells.push(`M${x} ${y}h1v1h-1z`);
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" role="img" aria-label="Código QR de cobro" shape-rendering="crispEdges"><path d="${cells.join('')}" fill="#1C1B1A"/>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}
function confirmSale(){
  const c = sheetCtx; const t = cartTotal();
  const received = c.method === 'efectivo' ? parseNum(c.received) : t;
  if (c.method === 'efectivo' && !(received >= t)) return;
  const changes = [];
  const lines = UI.cart.map(l => { const {_new, ...rest} = l; return rest; });
  const touched = {};
  lines.forEach(l => { const p = P(l.pid); if (!(l.pid in touched)) touched[l.pid] = p.stock; p.stock = r2(p.stock - (p.granel ? l.kg : l.qty)); });
  Object.keys(touched).forEach(id => { const p = P(id); changes.push({p, before:touched[id], after:p.stock}); });
  const sale = {id:S.seq++, ts:Date.now(), lines, total:t, method:c.method, received, change:r2(received - t), void:false};
  S.sales.push(sale); save();
  UI.cart = [];
  sheetCtx = {type:'done'};
  setSheetTitle('Listo');
  const fmt = (p, v) => p.granel ? kg(v) + (p.sacoKg ? ' (' + sacos(p, v) + ')' : '') : num(v) + ' u.';
  setSheetBody(`
    <div class="success">
      <svg class="check" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="M20 33.5 28 41 44 24"/></svg>
      <h2>Venta registrada</h2><div class="muted">#${sale.id} · ${c.method === 'efectivo' ? 'Efectivo' : 'QR'} · ${bs(t)}</div>
      ${c.method === 'efectivo' ? `<div class="big" style="margin-top:10px">Cambio a entregar<b>${bs(sale.change)}</b></div>` : ''}
    </div>
    <div class="changes"><h4>Stock actualizado</h4>${changes.map(x => `<div class="ch"><span>${esc(x.p.name)}</span><b>${fmt(x.p, x.before)} → ${fmt(x.p, x.after)}</b></div>`).join('')}</div>
    <button class="btn primary xl" data-act="close-sheet">Nueva venta</button>`);

}

/* ================= Reportes ================= */
function periodRange(per){
  const now = Date.now(), t0 = startOfDay(now);
  if (per === 'hoy') return {from:t0, to:now, label:'Hoy, ' + longDate(now)};
  if (per === 'semana') return {from:t0 - 6 * DAY, to:now, label:'Últimos 7 días'};
  return {from:t0 - 29 * DAY, to:now, label:'Últimos 30 días'};
}
const validSales = (from, to) => S.sales.filter(s => !s.void && s.ts >= from && s.ts <= to);
function renderReportes(){
  const idx = {hoy:0, semana:1, mes:2}[UI.period];
  document.getElementById('view').innerHTML = `
    <div class="page-head"><div><h1>Reportes</h1><p class="sub" id="rep-label"></p></div>
      <div class="head-actions">${seg('period', [['hoy','Hoy'],['semana','Semana'],['mes','Mes']], idx)}<button class="btn" data-act="export-csv">${ic('file')}Excel</button></div></div>
    <div id="rep-body"></div>`;
  renderRepBody();
}
function renderRepBody(){
  const {from, to, label} = periodRange(UI.period);
  document.getElementById('rep-label').textContent = label;
  const ss = validSales(from, to);
  const total = ss.reduce((a, s) => a + s.total, 0);
  const cost = ss.reduce((a, s) => a + s.lines.reduce((b, l) => b + l.cost, 0), 0);
  const gan = total - cost;
  const n = ss.length;
  // gráfico
  let buckets = [];
  if (UI.period === 'hoy'){
    for (let h = 8; h <= 20; h++) buckets.push({label:h + 'h', tip:pad(h) + ':00–' + pad(h) + ':59', v:0, n:0, key:h});
    ss.forEach(s => { const h = new Date(s.ts).getHours(); const b = buckets.find(x => x.key === h) || buckets[buckets.length - 1]; b.v += s.total; b.n++; });
  } else {
    const days = UI.period === 'semana' ? 7 : 30, t0 = startOfDay(Date.now());
    for (let d = days - 1; d >= 0; d--){ const ts = t0 - d * DAY; buckets.push({label: UI.period === 'semana' ? new Date(ts).toLocaleDateString('es-BO', {weekday:'short'}).replace('.', '') : shortDate(ts), tip: new Date(ts).toLocaleDateString('es-BO', {weekday:'long', day:'numeric', month:'short'}) + (d === 0 ? ' (hoy)' : ''), v:0, n:0, key:dayKey(ts)}); }
    ss.forEach(s => { const b = buckets.find(x => x.key === dayKey(s.ts)); if (b){ b.v += s.total; b.n++; } });
  }
  const max = Math.max(1, ...buckets.map(b => b.v));
  const step = niceStep(max / 3), top = Math.max(step * 3, Math.ceil(max / step) * step);
  const grid = [0, 1, 2, 3].map(i => step * i).filter(v => v <= top);
  const every = buckets.length > 14 ? 5 : 1;

/* Mantener para anular */
(function hold(){
  let t = null, el = null;
  const cancel = () => { if (el){ el.classList.remove('holding'); el = null; } clearTimeout(t); };
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest('[data-hold]'); if (!h) return;
    e.preventDefault(); el = h; h.classList.add('holding');
    t = setTimeout(() => { const id = Number(h.dataset.hold); cancel(); voidSale(id); }, 1200);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => document.addEventListener(ev, e => { if (el && (ev !== 'pointerleave' || e.target === el)) cancel(); }, true));
  document.addEventListener('keydown', e => { const h = e.target.closest && e.target.closest('[data-hold]'); if (h && (e.key === 'Enter' || e.key === ' ') && !e.repeat){ e.preventDefault(); el = h; h.classList.add('holding'); t = setTimeout(() => { const id = Number(h.dataset.hold); cancel(); voidSale(id); }, 1200); } });
  document.addEventListener('keyup', e => { if (el && (e.key === 'Enter' || e.key === ' ')) cancel(); });
})();

  const ss = S.sales.filter(s => s.ts >= S.caja.openedAt);

/* PDF mínimo (Helvetica, WinAnsi) sin librerías */
function pdfEsc(s){ let o = ''; const m = {0x2212:45, 0x2013:150, 0x2014:151, 0x2026:133, 0x2022:149, 0x2192:187}; for (const ch of String(s)){ const c = ch.codePointAt(0); if (ch === '(' || ch === ')' || ch === '\\') o += '\\' + ch; else if (c < 32) continue; else if (c < 128) o += ch; else { const b = c < 256 ? c : (m[c] ?? 63); o += '\\' + b.toString(8).padStart(3, '0'); } } return o; }
function tw(s, size){ let w = 0; for (const ch of String(s)){ w += /[0-9]/.test(ch) ? 556 : ' ,.:;/'.includes(ch) ? 278 : /[A-Z]/.test(ch) ? 667 : /[mw]/.test(ch) ? 800 : /[il]/.test(ch) ? 222 : 520; } return w * size / 1000; }
function buildPdf(cierre){
  const pages = []; let ops = ''; let y = 790; const L = 48, R = 547;
  const T = (s, x, size = 10, o = {}) => { const xx = o.right ? x - tw(s, size) * (o.bold ? 1.06 : 1) : x; ops += `BT /${o.bold ? 'F2' : 'F1'} ${size} Tf ${o.gray ? '0.45 0.45 0.45' : '0.1 0.1 0.1'} rg ${xx.toFixed(1)} ${y.toFixed(1)} Td (${pdfEsc(s)}) Tj ET\n`; };
  const H = (g = .82, w = .5) => { ops += `${g} G ${w} w ${L} ${(y - 5).toFixed(1)} m ${R} ${(y - 5).toFixed(1)} l S\n`; };
  const down = d => { y -= d; if (y < 60){ pages.push(ops); ops = ''; y = 790; } };
  const row = (a, b, bold) => { T(a, L, 10.5, {bold}); T(b, R, 10.5, {right:true, bold}); H(.9); down(18); };
  T('Pet Shop Premium', L, 18, {bold:true}); down(18);
  T('Cierre de caja · ' + longDate(cierre.closedAt), L, 11); down(14);
  T(`Apertura ${hm(cierre.openedAt)} · Cierre ${hm(cierre.closedAt)}`, L, 10, {gray:true}); down(28);
  T('RESUMEN', L, 9, {bold:true, gray:true}); down(16);
  row('Monto de apertura', bs(cierre.inicial));
  row(`Ventas en efectivo (${cierre.nCash})`, bs(cierre.cashV));
  row(`Ventas por QR (${cierre.nQr})`, bs(cierre.qrV));
  if (cierre.voids) row('Ventas anuladas', String(cierre.voids));
  row('Efectivo esperado', bs(cierre.esperado), true);
  row('Efectivo contado', bs(cierre.contado), true);
  row('Diferencia', difTxt(cierre.dif), true);
  down(12); T('ARQUEO', L, 9, {bold:true, gray:true}); down(16);
  DENOMS.forEach(([d, k]) => { const n = cierre.conteo[d] || 0; if (!n) return; T(`${k} ${bs(d)}`, L, 10); T('× ' + n, 300, 10, {right:true}); T(bs(d * n), R, 10, {right:true}); down(15); });
  down(14); T('VENTAS DEL TURNO — FORMA DE VENTA Y KILOS', L, 9, {bold:true, gray:true}); down(16);
  const cols = () => { T('Hora', L, 8.5, {bold:true, gray:true}); T('N°', 82, 8.5, {bold:true, gray:true}); T('Producto', 112, 8.5, {bold:true, gray:true}); T('Forma', 300, 8.5, {bold:true, gray:true}); T('Kilos', 420, 8.5, {bold:true, gray:true, right:true}); T('Bs', 480, 8.5, {bold:true, gray:true, right:true}); T('Pago', R, 8.5, {bold:true, gray:true, right:true}); H(.7); down(15); };
  cols();
  const sales = S.sales.filter(s => cierre.saleIds.includes(s.id));
  const fm = {};
  sales.forEach(s => s.lines.forEach(l => {
    const nm = l.name.length > 34 ? l.name.slice(0, 33) + '…' : l.name;

  const kids = []; let n = 5;
  pages.forEach(o => { const pid = n++, cid = n++; kids.push(pid + ' 0 R'); objs[pid] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`; objs[cid] = `<< /Length ${o.length} >>\nstream\n${o}\nendstream`; });

let dlNs;
async function download(blob, name, okMsg){
  if (window.claude && typeof window.claude.use === 'function'){
    if (dlNs === undefined){ try { dlNs = await window.claude.use('downloads'); } catch(e){ dlNs = null; } }
    if (dlNs){
      try { await dlNs.save({filename:name, data:blob}); toast(okMsg); }
      catch(e){ if (e && e.code !== 'declined') toast('No se pudo descargar aquí'); }
      return;
    }
  }
  plainDownload(blob, name); toast(okMsg);
}
function plainDownload(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a);
  try { a.click(); } catch(e){}
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function exportCsv(){
  const {from, to, label} = periodRange(UI.period);
  const rows = [['Fecha','Hora','Venta','Código','Producto','Forma de venta','Cantidad','Kilos','Precio Bs','Costo Bs','Ganancia Bs','Pago','Estado']];
  S.sales.filter(s => s.ts >= from && s.ts <= to).forEach(s => s.lines.forEach(l => rows.push([new Date(s.ts).toLocaleDateString('es-BO'), hm(s.ts), s.id, l.pid, l.name, MODE_LABEL[l.mode], l.mode === 'kilo' ? nkg(l.qty) : l.qty, l.kg ? nkg(l.kg) : '', num(l.total), num(l.cost), num(l.total - l.cost), s.method === 'efectivo' ? 'Efectivo' : 'QR', s.void ? 'Anulada' : 'Válida'])));
  const csv = '﻿' + rows.map(r => r.map(c => { c = String(c); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';')).join('\r\n');
  download(new Blob([csv], {type:'text/csv;charset=utf-8'}), `ventas-${UI.period}-${dayKey(Date.now())}.csv`, 'Excel de ventas descargado (' + label.toLowerCase() + ')');
}

document.addEventListener('click', e => {

  switch (act){
    case 'close-sheet': closeSheet(); break;

    case 'open-product': productSheet(id); break;
    case 'edit-product': productForm(id); break;
    case 'new-product': productForm(null); break;
    case 'sell-product': UI.posQ = ''; UI.posCat = 'todas'; closeSheet(true); if (UI.view !== 'venta') location.hash = 'venta'; setTimeout(() => { const p = P(id); p.granel ? chooser(id) : addUnit(p); }, 30); break;
    case 'toggle-granel': { const c = sheetCtx; c.granel = !c.granel; a.setAttribute('aria-pressed', c.granel); document.getElementById('sw-granel').classList.toggle('on', c.granel); document.getElementById('f-granel').hidden = !c.granel; document.getElementById('f-unidad').hidden = c.granel; break; }
    case 'pos-cat': UI.posCat = a.dataset.v; renderPosChips(); renderPosList(); break;
    case 'pos-add': { const p = P(id); p.granel ? chooser(id) : addUnit(p); break; }
    case 'seg': {
      const el = a.closest('.seg'), i = Number(a.dataset.i), name = a.dataset.segName; setSeg(el, i);
      if (name === 'period'){ UI.period = a.dataset.v; UI.showAllToday = false; renderRepBody(); }
      if (name === 'mode'){ sheetCtx.mode = a.dataset.v; sheetCtx.qty = 1; renderChooser(true); }
      if (name === 'pay'){ sheetCtx.method = a.dataset.v; setTimeout(() => renderPay(true), 0); }
      break; }
    case 'ch-q': { const c = sheetCtx; c.qty = Math.max(1, c.qty + Number(a.dataset.v)); a.parentElement.querySelector('.v').textContent = c.qty; renderChooser(false); break; }
    case 'ch-kg': { const c = sheetCtx; c.kg = Number(a.dataset.v); document.getElementById('ch-kg').value = nkg(c.kg); renderChooser(false); break; }
    case 'ch-kstep': { const c = sheetCtx; c.kg = Math.max(.5, r2((Math.round(c.kg * 2) / 2) + Number(a.dataset.v))); document.getElementById('ch-kg').value = nkg(c.kg); renderChooser(false); break; }
    case 'ch-add': { const c = sheetCtx, p = P(c.id); addToCart(p, c.mode, c.mode === 'kilo' ? c.kg : c.qty); closeSheet(); renderPosList(); toast(`${MODE_LABEL[c.mode]} de ${p.name} agregado`); break; }
    case 'cl-inc': case 'cl-dec': {
      const l = UI.cart[Number(a.dataset.i)], p = P(l.pid), st = l.mode === 'kilo' ? .5 : 1, d = act === 'cl-inc' ? st : -st;
      const nq = r2(l.qty + d);
      if (nq <= 0){ UI.cart.splice(Number(a.dataset.i), 1); }
      else { const nl = makeLine(p, l.mode, nq); if (d > 0 && nl.kg - l.kg > available(p.code) + 1e-9 && p.granel){ toast('No alcanza el stock'); break; } if (!p.granel && d > 0 && available(p.code) < 1){ toast('No alcanza el stock'); break; } Object.assign(l, nl); }
      renderCart(); renderPosList(); break; }
    case 'photo-remove': sheetCtx.photo = null; updatePicker(false); break;

    case 'export-csv': exportCsv(); break;
    case 'den': { const d = a.dataset.d; S.conteo[d] = Math.max(0, (S.conteo[d] || 0) + Number(a.dataset.v)); document.querySelector(`[data-den="${d}"]`).value = S.conteo[d]; save(); updateDiff(); break; }
    case 'fill-count': { let rest = turno().esperado; S.conteo = {}; DENOMS.forEach(([d]) => { const n = Math.floor(r2(rest / d) + 1e-9); if (n > 0){ S.conteo[d] = n; rest = r2(rest - n * d); } }); save(); DENOMS.forEach(([d]) => { const i = document.querySelector(`[data-den="${d}"]`); if (i) i.value = S.conteo[d] || 0; }); updateDiff(); break; }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'inv-q'){ UI.invQ = t.value; renderInvGrid(); }
  else if (t.id === 'pos-q'){ UI.posQ = t.value; renderPosList(); }
  else if (t.id === 'ch-kg'){ const v = parseNum(t.value); sheetCtx.kg = isNaN(v) ? 0 : v; renderChooser(false); }
  else if (t.id === 'pay-in'){ sheetCtx.received = t.value; renderPay(false); }
  else if (t.dataset.den){ S.conteo[t.dataset.den] = Math.max(0, Math.floor(parseNum(t.value)) || 0); save(); updateDiff(); }
  else if (t.name === 'cat' && t.id === 'f-cat'){ sheetCtx.cat = t.value; updatePicker(false); }
  else if (t.id === 'f-saco'){ const v = parseNum(t.value); document.getElementById('h-medio').textContent = v > 0 ? 'Medio saco: ' + kg(v / 2) + ' (se calcula solo)' : 'Sin saco: se vende solo por kilo'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches && (t.matches('[data-photo-for]') || t.matches('[data-photo-form]'))){ const file = t.files && t.files[0]; t.value = ''; if (file) handlePhoto(file, t.dataset.photoFor || null); return; }
  if (e.target.id === 'ch-kg' && sheetCtx){ let v = parseNum(e.target.value); v = isNaN(v) ? 0 : Math.max(.5, Math.round(v * 2) / 2); sheetCtx.kg = v; e.target.value = nkg(v); renderChooser(false); }
});
async function handlePhoto(file, code){
  let url;
  try { url = await readPhoto(file); } catch(err){ toast('Ese archivo no es una imagen'); return; }
  if (code){ // desde la ficha del producto: se guarda al instante
    if (!setPhoto(code, url)) return;
    const w = document.getElementById('pd-photo');
    if (w){ const old = w.querySelector('.ph'); old.outerHTML = ph(P(code), 'lg', '', true); const l = w.querySelector('.ph-edit'); l.title = 'Cambiar foto'; l.querySelector('.vh').textContent = 'Cambiar foto'; }
    refreshTiles(); toast('Foto guardada');
  } else if (sheetCtx && sheetCtx.type === 'form'){ // en el formulario: se guarda con el producto
    sheetCtx.photo = url; updatePicker(true);
  }
}
function updatePicker(fresh){
  const c = sheetCtx; if (!c || c.type !== 'form') return;
  const form = document.getElementById('pform');
  const cat = form ? form.querySelector('[name=cat]').value : c.cat;
  const cur = c.photo !== undefined ? c.photo : (c.id ? photoOf(P(c.id)) || null : null);
  document.getElementById('pp-prev').innerHTML = ph({code:c.id || '_new', cat}, 'lg', '', fresh, cur);
  document.getElementById('pp-label').textContent = cur ? 'Cambiar foto' : 'Subir foto';
  document.getElementById('pp-remove').hidden = !cur;
}
function refreshTiles(){
  if (UI.view === 'inventario') renderInvGrid();
  else if (UI.view === 'venta') renderPosList();
  else if (UI.view === 'reportes') renderRepBody();
}
/* Arrastrar y soltar una foto sobre el selector (computadora) */
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { const pp = e.target.closest && e.target.closest('#pp'); if (pp){ e.preventDefault(); pp.classList.add('drop'); } }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { const pp = e.target.closest && e.target.closest('#pp'); if (!pp) return; if (ev === 'dragleave' && pp.contains(e.relatedTarget)) return; pp.classList.remove('drop'); if (ev === 'drop'){ e.preventDefault(); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handlePhoto(f, null); } }));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && root.classList.contains('open')){ e.preventDefault(); closeSheet(true); return; }
  if (e.key === 'Enter' && e.target.id === 'pos-q'){
    e.preventDefault();
    const q = e.target.value.trim().toUpperCase();
    const exact = S.products.find(p => p.code === q);
    const list = posResults();
    const p = exact || (list.length === 1 ? list[0] : null);
    if (p){ if (exact){ e.target.value = ''; UI.posQ = ''; renderPosList(); } p.granel ? chooser(p.code) : addUnit(p); }
  }
  if (e.key === 'Enter' && e.target.id === 'pay-in'){ e.preventDefault(); if (!document.getElementById('pay-ok').disabled) confirmSale(); }
  if (e.key === '/' && !root.classList.contains('open') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){
    const s = document.getElementById(UI.view === 'venta' ? 'pos-q' : 'inv-q'); if (s){ e.preventDefault(); s.focus(); s.select(); }
  }
  if (e.target.id === 'cartbar' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.target.click(); }
});
